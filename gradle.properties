# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.java.home=C\:/Program\ Files/Java/jdk-20
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
# The VS Code Java extension bundles a Temurin 21 JRE (no jlink) that advertises
# itself as a JDK. Daemon-JVM criteria ("Temurin 21") matched it, so gradlew kept
# attaching to VS-Code-spawned daemons running on it and the Android jdkImage
# transform failed. Fix: no daemon-jvm criteria (file deleted) — org.gradle.java.home
# above is authoritative, and a VS Code daemon on a different JVM is incompatible,
# so the CLI can never reuse it. Auto-detect stays off, belt and braces.
org.gradle.java.installations.auto-detect=false
# Explicit JDK roots for toolchain resolution (auto-detect alone still found
# the VS Code JRE for the AGP jdkImage transform, which has no jlink).
org.gradle.java.installations.paths=C\:/Program\ Files/Java/jdk-20,C\:/Program\ Files/Java/jdk-26.0.1
